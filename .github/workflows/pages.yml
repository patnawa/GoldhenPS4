name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'evidence/upstream-files.json'
      - 'evidence/local-overrides.json'
      - 'server.py'
      - 'tools/test-host.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify preserved site files
        run: python3 server.py --check
      - name: Check launcher behavior
        run: node tools/test-host.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
