<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GoldHEN v2.4b18.12 Host by patnawa</title>
<style>
html{background:radial-gradient(130% 110% at 50% 0%,#1c2531 0%,#0e1319 55%,#06080c 100%);color:#e8edf4;text-align:center;overflow:hidden}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Arial,"Noto Sans",sans-serif}
.card{width:84%;max-width:960px;background:rgba(16,22,30,.84);border:1px solid rgba(122,160,220,.22);border-radius:18px;padding:40px 34px 26px;box-shadow:0 18px 60px rgba(0,0,0,.55);position:relative}
.card:before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(110,168,255,0),rgba(110,168,255,.85),rgba(110,168,255,0))}
.brand{letter-spacing:.35em;font-size:13px;color:#8fb3e8;text-transform:uppercase;margin-bottom:8px}
h1.title{font-size:30px;margin:0 0 2px;color:#fff;text-shadow:none}
.sub{font-size:15px;color:#93a4ba;margin:0 0 20px}
.chip{display:inline-block;margin-bottom:26px;font-size:13px;color:#cfe2ff;background:rgba(56,92,160,.35);border:1px solid rgba(140,180,255,.35);border-radius:999px;padding:5px 16px}
h1#msgs{font-size:21px;font-weight:500;line-height:1.6;min-height:96px;margin:0 0 26px;color:#eaf2ff;word-wrap:break-word}
.rule{height:1px;border:0;margin:0 0 16px;background:linear-gradient(90deg,rgba(140,180,255,0),rgba(140,180,255,.35),rgba(140,180,255,0))}
.credits{font-size:13px;color:#9fb0c5;line-height:1.9;margin:0}
.credits a{color:#6ea8ff;text-decoration:none}
</style>
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

var hostStarted = false;
var cacheWaiting = false;
function startHost() {
if (hostStarted) return;
if (!isPS4) {
    msgs.innerHTML = "Open this host in the PS4 browser.<br>Supported firmware: 5.05, 5.07, 7.00-8.52, 9.00-9.60, 10.00-11.02, 11.50-12.02, 12.50-13.00, and 13.02-13.52";
} else {
    var supported = fwNum == 5.05 || fwNum == 5.07 ||
        (fwNum >= 7.00 && fwNum <= 8.52) || (fwNum >= 9.00 && fwNum <= 9.60) ||
        (fwNum >= 10.00 && fwNum <= 11.02) || (fwNum >= 11.50 && fwNum <= 12.02) ||
        (fwNum >= 12.50 && fwNum <= 13.00) || (fwNum >= 13.02 && fwNum <= 13.52);
    if (!supported) {
        msgs.textContent = "Unsupported Firmware: " + fwVersion;
        return;
    }
    var cache = window.applicationCache;
    if (!cache || typeof cache.status !== "number") {
        msgs.textContent = "Offline cache is unavailable. Open this host in the PS4 browser.";
        return;
    }
    if (cache.status === 2 || cache.status === 3) {
        msgs.textContent = "Checking or updating offline cache... Please Wait";
        if (!cacheWaiting) {
            cacheWaiting = true;
            cache.addEventListener("noupdate", startHost, false);
            cache.addEventListener("cached", function () {
                msgs.textContent = "Cache Installed Successfully. Close And Re-Open Your Browser.";
            }, false);
            cache.addEventListener("updateready", function () {
                msgs.textContent = "Cache Updated. Close And Re-Open Your Browser.";
            }, false);
            cache.addEventListener("error", function () {
                // An offline update check may fail while a complete cache stays usable.
                if (cache.status === 1) startHost();
                else msgs.textContent = "Cache check failed. Close And Re-Open Your Browser.";
            }, false);
            cache.addEventListener("obsolete", function () {
                msgs.textContent = "Offline cache is obsolete. Clear Browser Data and Re-Install Cache.";
            }, false);
        }
        return;
    }
    if (cache.status !== 0 && cache.status !== 1) {
        msgs.textContent = cache.status === 4 ?
            "Cache Updated. Close And Re-Open Your Browser." :
            "Offline cache is unavailable or obsolete. Clear Browser Data and Re-Install Cache.";
        return;
    }
    hostStarted = true;
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var consoleDirty = null;
            try { consoleDirty = sessionStorage.getItem("goldhen-console-dirty"); } catch (eStore) { }
            if (consoleDirty) {
                msgs.innerHTML = "The last attempt left the console in an unsafe state. "
                    + "<span style=\"color: red;\">Power the PS4 off, then back on</span>, "
                    + "and re-open the browser.";
                return;
            }
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
}
// The status element must exist before any console script can run or report an error.
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startHost, false);
} else {
    startHost();
}
</script>
<div class="card">
<div class="brand">PlayStation 4 - Local Host</div>
<h1 class="title">GoldHEN v2.4b18.12</h1>
<p class="sub">Host by patnawa</p>
<div class="chip">Host build 1.0.3</div>
<h1 id="msgs">Loading GoldHEN v2.4b18.12... Please Wait</h1>
<hr class="rule">
<p class="credits">Special thanks to <a href="https://twitter.com/_AlAzif">@_AlAzif</a>, ChendoChap, <a href="https://x.com/Kameleonre_">@Kameleonre_</a>, SiSTR0 and Abc.<br>Original host by <a href="https://gamerhack.github.io/g2all/">GamerHack</a> - hosted by patnawa.</p>
</div>
</body>
</html>
